<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Willie Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0c; color: #cfd8dc; font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { height: 48px; min-height: 48px; background: #101014; border-bottom: 1px solid #1e2a32; display: flex; align-items: center; padding: 0 16px; gap: 12px; z-index: 10; }
    #back-btn { background: #14141a; border: 1px solid #1e2a32; color: #b0bec5; padding: 6px 14px; border-radius: 6px; font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    #back-btn:hover { background: #1c1c26; border-color: #37474f; color: #e0e8ef; }
    #game-title { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; color: #e0e8ef; letter-spacing: 3px; text-transform: uppercase; }
    #fullscreen-btn { margin-left: auto; background: #14141a; border: 1px solid #1e2a32; color: #b0bec5; padding: 6px 14px; border-radius: 6px; font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; }
    #fullscreen-btn:hover { background: #1c1c26; border-color: #37474f; color: #e0e8ef; }
    #game-frame { flex: 1; width: 100%; border: none; display: block; }
    #loading { position: absolute; inset: 48px 0 0; background: #0a0a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 5; }
    .spinner { width: 40px; height: 40px; border: 2px solid #1e2a32; border-top-color: #b0bec5; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 4px; color: #546e7a; text-transform: uppercase; }
  </style>
</head>
<body>
<div id="topbar">
  <a id="back-btn" href="willie-home.html">← Back</a>
  <span id="game-title">Loading...</span>
  <button id="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>
<div id="loading">
  <div class="spinner"></div>
  <p>Loading Game...</p>
</div>
<iframe id="game-frame" allowfullscreen></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const src  = params.get('src')  || '';
  const name = params.get('name') || 'Game';
  document.getElementById('game-title').textContent = name.toUpperCase();
  document.title = name + ' — Willie Games';
  const frame = document.getElementById('game-frame');
  const loading = document.getElementById('loading');
  frame.onload = () => { loading.style.display = 'none'; };

  
  const isLocal = src.startsWith('gfiles/') || src.startsWith('/gfiles/') || src.startsWith('./');
  if (isLocal) {
    
    frame.src = '/' + src.replace(/^\//, '');
  } else {
    frame.src = src;
  }

  function goFullscreen(){
    if(frame.requestFullscreen) frame.requestFullscreen();
    else if(frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){document.body.innerHTML='';document.title='New Tab';}
  });
</script>
</body>
</html>
